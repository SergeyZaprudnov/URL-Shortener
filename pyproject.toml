[project]
name = "url-shortener"
version = "0.1.0"
description = "URL Shortener API"
authors = [
    {name = "szaprudnov@hotmail.com"}
]
license = "\"MIT\""
requires-python = ">=3.11, <3.13"
dependencies = [
    "django (>=5.0,<6.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "ruff (>=0.17.5,<0.18.0)"
]

[tool.ruff.lint]
ignore= ["RUF012", "TRY002"]